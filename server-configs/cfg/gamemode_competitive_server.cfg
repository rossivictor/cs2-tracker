// ===================================
// CS2 AI Coach — Competitive Offline
// Executado pelo engine DEPOIS do config
// base do modo competitivo, por isso as
// sobrescritas de bot/economia vivem aqui
// e não no server.cfg.
// ===================================

// Bot quota
bot_quota                               10
bot_quota_mode                          fill

// Bot difficulty
bot_difficulty                          5
custom_bot_difficulty                   5
sv_auto_adjust_bot_difficulty           false
bot_autodifficulty_threshold_high       1.0
bot_autodifficulty_threshold_low       -1.0

// Bot behavior
bot_defer_to_human                      1
bot_allow_rogues                        1
bot_stop                                0
bot_zombie                              0

// Bot economy — bots compram igual humano
sv_bot_buy_grenade_chance               100
sv_bot_buy_decoy_weight                 1
sv_bot_buy_flash_weight                 7
sv_bot_buy_hegrenade_weight             7
sv_bot_buy_smoke_weight                 6
sv_bot_buy_molotov_weight               6

// Round settings
mp_roundtime                            1.92
mp_roundtime_defuse                     1.92
mp_freezetime                           15
mp_buytime                              20
mp_overtime_enable                      1
mp_overtime_limit                       3
mp_maxrounds                            24

// Economy
mp_startmoney                           800
mp_maxmoney                             16000
mp_afterroundmoney                      0

// Match settings
mp_autoteambalance                      0
mp_limitteams                           0
mp_friendlyfire                         0
