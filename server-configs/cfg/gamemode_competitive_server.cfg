// ===================================
// CS2 Tracker — Competitive Offline
// Executado pelo engine DEPOIS do config
// base do modo competitivo, por isso as
// sobrescritas de bot/economia vivem aqui
// e não no server.cfg.
// ===================================

// Bot quota
bot_quota                               10
bot_quota_mode                          fill

// Bot difficulty
bot_difficulty                          5
custom_bot_difficulty                   5
sv_auto_adjust_bot_difficulty           false
bot_autodifficulty_threshold_high       1.0
bot_autodifficulty_threshold_low       -1.0

// Bot behavior
bot_defer_to_human                      1
bot_allow_rogues                        1
bot_stop                                0
bot_zombie                              0

// Bot economy — bots compram igual humano
sv_bot_buy_grenade_chance               100
sv_bot_buy_decoy_weight                 1
sv_bot_buy_flash_weight                 7
sv_bot_buy_hegrenade_weight             7
sv_bot_buy_smoke_weight                 6
sv_bot_buy_molotov_weight               6

// Round settings
mp_roundtime                            1.92
mp_roundtime_defuse                     1.92
mp_freezetime                           15
mp_buytime                              20
mp_overtime_enable                      1
mp_overtime_limit                       3
mp_maxrounds                            24

// Economy
mp_startmoney                           800
mp_maxmoney                             16000
mp_afterroundmoney                      0

// Match settings
mp_autoteambalance                      0
mp_limitteams                           0
mp_friendlyfire                         0

// ===========================================================================
// GOTV — demo gravada sai sem a partida dentro. EXPERIMENTO EM CURSO.
// ===========================================================================
//
// CORREÇÃO (21/09/2026): a conclusão anterior neste bloco dizia que
// tv_delay 0 tinha "CONFIRMADO RESOLVIDO" o truncamento. Está invertida.
// Medição das 39 demos em docker/demos-live/, em ordem cronológica:
//
//     tv_delay   duração gravada
//     --------   ---------------
//        105     até 106.4s
//         15     16.4 / 16.4 / 16.5 / 16.5s
//          0     1.4 – 1.6s   <- ficou 10x PIOR, não melhor
//
// A relação é   duração da demo = tv_delay + ~1.5s,   e bate nos três
// patamares com precisão de décimo. A "demo de teste" que pareceu bater
// com o tempo real batia porque o teste em si durou poucos segundos: com
// delay 0 qualquer gravação curta bate.
//
// O QUE ISSO MUDA NO DIAGNÓSTICO: não é que faltem eventos de combate numa
// demo completa — é que a demo tem 1,5 segundo. Não existe partida dentro
// do arquivo. Por isso nenhuma das 39 tem player_death, e por isso o awpy
// não parseia (falta round_officially_ended, que nunca chega a acontecer).
// O que está em disco parece ser só o buffer de delay do GOTV.
//
// HIPÓTESES JÁ DESCARTADAS — não vale re-testar:
//
//  1. tv_transmitall. Ficou como 1 (abaixo), mas NÃO resolve: os eventos
//     server_cvar gravados dentro das demos de 19/09 e 21/09 mostram
//     tv_transmitall=1 e mesmo assim zero eventos de combate. Mantido
//     ligado só pra não mexer em duas variáveis no mesmo experimento.
//  2. tv_delay 0 (ver acima). É regressão.
//  3. CS2_LAN=1 / modo insecure (ver a nota no docker-compose.yml). Foi
//     mudado pra 0 em 20/09 00:08; as demos de 21/09, posteriores, são as
//     piores da série — 0 ticks, só o evento server_cvar. Ressalva: isso
//     só vale se o container foi recriado depois da edição.
//
// RESULTADO (22/09/2026): tv_delay ALTO NÃO SERVE — piora.
// Com 960, a MatchZy loga "Going to stop demorecording in 974.5s" e o
// arquivo NUNCA é escrito. Conferido em duas partidas (matchid 51 e 52):
// prazo vencido, nenhum .dem no host nem dentro do container, e nenhuma
// linha de "stopped" no log. Com tv_delay 0 o prazo é 14.5s e o arquivo
// aparece (curto, mas aparece). Voltamos pra 0.
//
// Efeito colateral que isso causou: watcher._map_name_for tirava o nome do
// mapa do nome do .dem, e sem arquivo duas partidas entraram com map=NULL.
// Corrigido lendo o maplist do match_config.json, que não depende da demo.
//
// O eixo tv_delay está esgotado: em nenhum valor a demo contém a partida.
// A duração gravada sempre acompanhou o delay, o que aponta pro problema
// estar em QUANDO a gravação começa e para, não em cvar de transmissão.
// Próxima pista, dos logs: "[StartDemoRecording] Demo recording is already
// in progress." aparece em toda partida — vale investigar quem já está
// gravando antes da MatchZy pedir.
//
// TENTATIVA ANTERIOR (mantida como registro): o maior tv_delay que o jogo aceita.
// A ideia era um buffer maior que a partida inteira, mas o CS2 TRAVA
// tv_delay em 960s (16 min) — pedimos 1800 e o RCON devolveu 960
// (confirmado em 22/09/2026). Como as partidas aqui duram 19–23 min (ver
// matches.duration_minutes), o buffer NÃO cobre a partida toda: no melhor
// caso pega os últimos 16 minutos. Já serve pro teste, e já seria uma
// melhora enorme sobre 1,5s.
//
// COMO LER O RESULTADO, depois da próxima partida:
//   tools/enrich_from_demos.py --dry-run   diz se a demo passou a parsear.
//   Demo com ~961s e partida dentro  -> confirmado. O gargalo é a gravação
//                                       só conter o buffer, e 16 min é o
//                                       teto do que dá pra recuperar assim.
//   Demo com ~961s só de warmup      -> o buffer é tempo de relógio, não
//                                       conteúdo de partida. Contorno morto.
//   Demo com ~1.5s                   -> a relação com tv_delay caiu; o
//                                       gargalo é outro.
//
// CUSTO CONHECIDO: delay alto faz a MatchZy esticar o
// mp_match_restart_delay (com 105 observou-se 130s), e o client
// desconecta na tela de "vote for next map" entre mapas de uma série.
// ENTÃO: teste isto em BO1. Pra voltar ao estado anterior, tv_delay 0.
tv_delay                                0
tv_transmitall                          1
