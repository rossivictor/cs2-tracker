# Spike do Passo 0 (Camada 1) — ver docker/SPIKE.md.
# Objetivo único deste compose: validar se o MatchZy reconhece uma
# partida como "ao vivo" e reporta resultado quando team2 não tem
# jogadores humanos (só bots do CS2 preenchendo via bot_quota fill).
# Não é a stack final — não tem orquestração de torneio nem watcher
# plugado ainda.
#
# Usa xbird/cs2-matchzy (Metamod + CounterStrikeSharp + MatchZy já
# instalados, baseada em joedwards32/cs2) em vez da imagem base +
# instalação manual — já validada no seu repo cs2-ai-bot-coach.

services:
  cs2-server:
    image: xbird/cs2-matchzy
    container_name: cs2-spike
    environment:
      # Sem isso, o SteamCMD usa $HOME=/root pra logs/cache — pasta fora
      # do volume persistente e não pertencente ao usuário "steam" (uid
      # 1000) que o processo roda. Causa raiz documentada de falhas de
      # verificação recorrentes (joedwards32/CS2#130).
      - HOME=/home/steam
      - SRCDS_TOKEN=${SRCDS_TOKEN}
      - CS2_SERVERNAME=CS2 Tracker - Spike MatchZy
      - CS2_RCONPW=${CS2_RCONPW}
      # Passo 1 (Camada 1): estava em 1 ("dispensa GSLT pra teste local"), mas
      # isso força o servidor em modo "insecure" (VAC desligado) mesmo com um
      # SRCDS_TOKEN válido — confirmado via RCON `status` (insecure) e no log
      # do container ("SV: VAC secure mode disabled."). Diagnosticado como a
      # causa mais provável de demos gravadas pelo GOTV saírem sem nenhum
      # evento de combate (player_death/player_hurt/weapon_fire/round_end
      # todos zerados via demoparser2, apesar do CSV do MatchZy mostrar kills
      # reais) — o awpy não consegue parsear essas demos por isso.
      - CS2_LAN=0
      - CS2_GAMETYPE=0
      - CS2_GAMEMODE=1
      - CS2_STARTMAP=de_mirage
      # 2x team_size (5x5 = 10) + 1 slot pro GOTV/SourceTV, que consome uma
      # vaga própria mesmo sendo um "bot" à parte dos times. Com só 10, os
      # 9 bots do 5x5 enchiam o servidor inteiro antes do humano conectar
      # ("Não foi possível se conectar — o servidor está cheio").
      - CS2_MAXPLAYERS=11
      - CS2_LOG=on
      - TV_ENABLE=1
      - TV_PORT=27020
      # SteamID64 com admin no MatchZy (necessário pra .start/.forceready
      # funcionarem sem editar admins.json na mão) — mesmo valor que vai
      # em docker/match_config.spike.json.
      - MATCHZY_ADMINS=${MATCHZY_ADMINS}
      # Sem isso a imagem busca "latest" do Metamod/CSSharp a cada boot —
      # container ficou parado uns dias e, ao subir de novo, pegou um
      # Metamod mais novo (interface 18) incompatível com os plugins
      # nativos instalados (CounterStrikeSharp, RayTrace, BotHider, todos
      # compilados pra interface 17): "[META] Loaded 0 plugins." no log,
      # matchzy_loadmatch/css_start viravam "Unknown command". Fixando nas
      # versões que sabíamos que funcionavam juntas (as que já estavam
      # instaladas antes desse auto-update quebrar tudo).
      - MMSOURCE_FIXED_VERSION=2.0.0.1411
      - CSSHARP_FIXED_VERSION=v1.0.373
      - MATCHZY_FIXED_VERSION=0.8.15
    volumes:
      # Dados persistentes do servidor (jogo + addons instalados pela imagem).
      - cs2-data:/home/steam/cs2-dedicated/
      # Reaproveita o cfg já validado no fluxo nativo (bot_difficulty,
      # economia de bot, mp_roundtime etc.) — é o arquivo que a engine
      # executa por último, então tem a palavra final sobre essas cvars.
      - ./server-configs/cfg/gamemode_competitive_server.cfg:/home/steam/cs2-dedicated/game/csgo/cfg/gamemode_competitive_server.cfg
      # match_config.json de teste do spike (edite o STEAMID64 antes de usar).
      - ./docker/match_config.spike.json:/home/steam/cs2-dedicated/game/csgo/match_config.spike.json
      # Plugin DefaultAgents-CS2 (CounterStrikeSharp) — força agentes default
      # (visual "competitivo") em todo mundo, sem mexer em skin de arma/faca/
      # luva. Baixado de github.com/srwiruwiru/DefaultAgents-CS2 (release
      # build-1). Versionado aqui (não no volume nomeado cs2-data) pelo mesmo
      # motivo do gamemode_competitive_server.cfg: sobrevive a um container
      # novo sem precisar reinstalar manualmente.
      - ./docker/plugins/DefaultAgents:/home/steam/cs2-dedicated/game/csgo/addons/counterstrikesharp/plugins/DefaultAgents
      # Passo 1 (Camada 1): expõe as pastas onde o MatchZy grava demo e CSV
      # de stats direto no host, sobrepondo o volume nomeado cs2-data só
      # nesses subcaminhos — sem isso, precisaríamos de `docker cp` manual
      # depois de cada partida pra tirar o .dem de dentro do container.
      - ./docker/demos-live:/home/steam/cs2-dedicated/game/csgo/MatchZy
      - ./docker/stats-live:/home/steam/cs2-dedicated/game/csgo/MatchZy_Stats
    ports:
      - "27015:27015/tcp"
      - "27015:27015/udp"
      - "27020:27020/udp"
    stdin_open: true # docker attach --sig-proxy=false cs2-spike
    tty: true

volumes:
  cs2-data:
