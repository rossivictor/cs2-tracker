# Servidor CS2 dedicado (container cs2-spike): imagem xbird/cs2-matchzy, com Metamod,
# CounterStrikeSharp e MatchZy já instalados. ver [[ADR-0007]]

services:
  cs2-server:
    image: xbird/cs2-matchzy
    container_name: cs2-spike
    environment:
      # SteamCMD com HOME no volume e no usuário steam (uid 1000); com /root, falha a
      # verificação. ver [[imagem-e-boot]]
      - HOME=/home/steam
      - SRCDS_TOKEN=${SRCDS_TOKEN}
      - CS2_SERVERNAME=CS2 Tracker - Spike MatchZy
      - CS2_RCONPW=${CS2_RCONPW}
      # 0, não 1: CS2_LAN=1 força o modo insecure (VAC desligado) mesmo com GSLT.
      # ver [[imagem-e-boot]]
      - CS2_LAN=0
      - CS2_GAMETYPE=0
      - CS2_GAMEMODE=1
      - CS2_STARTMAP=de_mirage
      # 2 x team_size + 1: o GOTV ocupa um slot (com 10, o 5x5 enchia o servidor
      # antes do humano conectar). ver [[imagem-e-boot]]
      - CS2_MAXPLAYERS=11
      - CS2_LOG=on
      - TV_ENABLE=1
      - TV_PORT=27020
      # SteamID64 com admin no MatchZy (necessário pra .start/.forceready
      # funcionarem sem editar admins.json na mão) — mesmo valor que o
      # wizard grava no team1 do docker/runtime/match_config.spike.json.
      - MATCHZY_ADMINS=${MATCHZY_ADMINS}
      # Versões fixadas: sem pin, o boot baixa o latest e quebra MatchZy e captura. Metamod e
      # CSSharp são par (1411 com <= 1.0.374; 1469 com 1.0.375 a 1.0.380); a 1.0.380 está no
      # volume, instalada à mão. Troca só por runbook, em janela: ver [[ADR-0009]] e [[b1.19-cssharp-1.0.380]]
      - MMSOURCE_FIXED_VERSION=2.0.0.1469
      - CSSHARP_FIXED_VERSION=v1.0.380
      - MATCHZY_FIXED_VERSION=0.8.15
    volumes:
      # Jogo e addons (plugins de bot instalados à mão): não se reproduz, é external.
      # ver [[ADR-0010]]
      - cs2-data:/home/steam/cs2-dedicated/
      # Reaproveita o cfg já validado no fluxo nativo (bot_difficulty,
      # economia de bot, mp_roundtime etc.) — é o arquivo que a engine
      # executa por último, então tem a palavra final sobre essas cvars.
      - ./server-configs/cfg/gamemode_competitive_server.cfg:/home/steam/cs2-dedicated/game/csgo/cfg/gamemode_competitive_server.cfg
      # match_config de runtime (card P1.9): a PASTA, ignorada pelo git, que
      # o wizard reescreve a cada partida a partir do template versionado
      # (docker/match_config.template.json). Pasta e não arquivo: o bind de
      # arquivo prende o inode (armadilha 50). O `matchzy_loadmatch` usa o
      # caminho relativo a game/csgo: runtime/match_config.spike.json.
      - ./docker/runtime:/home/steam/cs2-dedicated/game/csgo/runtime
      # Hook da imagem (o entry.sh faz `source pre.sh` antes do cs2.sh): registra o
      # overrides/botprofile.vpk no gameinfo.gi; sem ele, perfil pro dá "no profile".
      # ver [[bots-e-perfis]] e [[reconstruir-volume]]
      - ./docker/pre.sh:/home/steam/cs2-dedicated/pre.sh
      # DefaultAgents desligado: religar a linha abaixo quebra o modelo da arma
      # ("not resident"). ver [[imagem-e-boot]]
      # - ./docker/plugins/DefaultAgents:/home/steam/cs2-dedicated/game/csgo/addons/counterstrikesharp/plugins/DefaultAgents
      # RayTraceImpl mascarado por pasta vazia: aborta o servidor na segunda troca de
      # mapa (logger 'RayTrace' already exists). ver [[imagem-e-boot]]
      - ./docker/plugins/_empty:/home/steam/cs2-dedicated/game/csgo/addons/counterstrikesharp/plugins/RayTraceImpl
      # E o lado Metamod nativo do RayTrace, que é quem age: mascarar só o wrapper
      # CSSharp não basta. ver [[imagem-e-boot]]
      - ./docker/plugins/_empty:/home/steam/cs2-dedicated/game/csgo/addons/RayTrace
      # Plugins de bot: instalados à mão no volume, quebram com build nova do CS2 (patch
      # por assinatura) e dependem uns dos outros; religar um por vez, uma partida por
      # passo. O roster nomeado vem do VPK, não deles. ver [[imagem-e-boot]] e [[trilha-de-bots]]
      # B1.7: BotAI do fork local (CS2-BotAI a23f7e2 + patches B1.7b e B1.7c, m_gameState por assinatura).
      # Pasta gerada fora do repo (AGPL, gitignored); build e volta:
      # docs/runbooks/b1.7b-botai-fork-assinatura.md.
      - ./docker/plugins/BotAI:/home/steam/cs2-dedicated/game/csgo/addons/counterstrikesharp/plugins/BotAI
      # B1.4b: BotAimImprover compilado do upstream (ed0ard/CS2-Bullseye-Bot
      # c3d10f5: offsets Linux corrigidos e trace pela API da CSSharp, sem o
      # RayTrace nativo). A pasta é gerada fora do repo (AGPL, gitignored);
      # build e volta: docs/runbooks/b1.4b-botaimimprover-upstream.md.
      # B1.17 (08/11): mascarado por pasta vazia, por decisão do Victor, para
      # comparar a mira dos bots sem ele. Volta: restaurar a fonte
      # ./docker/plugins/BotAimImprover e recriar em janela. ver [[trilha-de-bots]]
      - ./docker/plugins/_empty:/home/steam/cs2-dedicated/game/csgo/addons/counterstrikesharp/plugins/BotAimImprover
      # B1.6: BotBuy religado (versão do volume; sem assinatura nem offset
      # fixo, protege ItemServices nulo). Volta: descomentar a linha abaixo.
      # - ./docker/plugins/_empty:/home/steam/cs2-dedicated/game/csgo/addons/counterstrikesharp/plugins/BotBuy
      - ./docker/plugins/_empty:/home/steam/cs2-dedicated/game/csgo/addons/counterstrikesharp/plugins/BotHiderImpl
      # B1.9: BotRandomizer compilado do upstream (ed0ard/CS2-Bot-Randomizer
      # 276f1ce, API 1.0.375; skins, facas e luvas). Pasta gerada fora do repo
      # (AGPL, gitignored); build e volta: docs/runbooks/b1.9-botrandomizer-upstream.md.
      - ./docker/plugins/BotRandomizer:/home/steam/cs2-dedicated/game/csgo/addons/counterstrikesharp/plugins/BotRandomizer
      # B1.5: BotState religado (versão do volume; patches de FOV só escrevem
      # com assinatura e bytes originais conferidos; hooks sem endereço se
      # desligam no try/catch). Volta: descomentar a linha abaixo.
      # - ./docker/plugins/_empty:/home/steam/cs2-dedicated/game/csgo/addons/counterstrikesharp/plugins/BotState
      # Lado Metamod NATIVO do BotHider — mesma lição do RayTrace acima, onde
      # ocultar só o wrapper CSSharp não bastou.
      - ./docker/plugins/_empty:/home/steam/cs2-dedicated/game/csgo/addons/BotHider
      # B1.13: NadeSystem do fork local (1.2.1 + assinatura da smoke da 2000935), pasta
      # inteira com as grenades/ que o plugin lê ao lado da DLL; gerada fora do repo
      # (AGPL, gitignored). Build, volta e máscara: ver [[b1.13-plugins-de-bot-2000935]]
      - ./docker/plugins/NadeSystem:/home/steam/cs2-dedicated/game/csgo/addons/counterstrikesharp/plugins/NadeSystem
      # Demo e CSV da MatchZy direto no host, por cima do cs2-data só nestes
      # subcaminhos. ver [[reconstruir-volume]]
      - ./docker/demos-live:/home/steam/cs2-dedicated/game/csgo/MatchZy
      - ./docker/stats-live:/home/steam/cs2-dedicated/game/csgo/MatchZy_Stats
      # Captura: plugin próprio que grava a partida em events-live/current.jsonl
      # (fonte em docker/plugins-src/Cs2TrackerEvents/). ver [[ADR-0008]] e [[contrato-events-jsonl]]
      - ./docker/plugins/Cs2TrackerEvents:/home/steam/cs2-dedicated/game/csgo/addons/counterstrikesharp/plugins/Cs2TrackerEvents
      - ./docker/events-live:/home/steam/cs2-dedicated/game/csgo/events-live
    ports:
      # P1.11: a 27015/tcp é só o RCON (TUI, start_match, watcher e
      # jogavel.py falam com 127.0.0.1:27015); publicada só no loopback,
      # para não expor o RCON na LAN. A UDP 27015 (jogo) e a UDP 27020
      # (CSTV) seguem em todas as interfaces. "Testado da LAN" é do papel
      # servidor, na janela. Teste: tests/test_rcon_loopback.py.
      - "127.0.0.1:27015:27015/tcp"
      - "27015:27015/udp"
      - "27020:27020/udp"
    stdin_open: true # docker attach --sig-proxy=false cs2-spike
    tty: true

volumes:
  # Nome fixo e external: o compose nunca cria nem apaga o volume (~73 GB, não
  # reproduzível); se ele não existir, o `up` falha. ver [[ADR-0010]] e [[reconstruir-volume]]
  cs2-data:
    external: true
    name: cs2-tracker_cs2-data
